# fly.toml app configuration file generated for openchesslab on 2026-09-25T11:10:11+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openchesslab'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  PHX_SERVER = 'true'
  PHX_HOST = 'openchesslab.com'
  DNS_CLUSTER_QUERY = 'openchesslab.internal'
  GAME_STORE_OWNER = 'true'
  GAME_RECORD_STORE_OWNER = 'true'
  ANALYSIS_STORE_OWNER = 'true'

  GAME_STORE_DIRECTORY = '/data/game-db'
  ANALYSIS_STORE_PATH = '/data/analysis-store.dets'

  GAME_STORE_CANONICAL_BUCKET_COUNT = '65536'
  GAME_STORE_POSITION_BUCKET_COUNT = '65536'

[processes]
  app = "env GAME_STORE_OWNER=true GAME_RECORD_STORE_OWNER=true ANALYSIS_STORE_OWNER=true /app/bin/openchesslab start"
  replica = "env GAME_STORE_OWNER=false GAME_RECORD_STORE_OWNER=false ANALYSIS_STORE_OWNER=false /app/bin/openchesslab start"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app', 'replica']

[[http_service.checks]]
  grace_period = "5s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/health"

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/ready"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# The existing volume is still required by the legacy GameDB and AnalysisStore.
[[mounts]]
  source = "position_db"
  destination = "/data"
  processes = ["app"]
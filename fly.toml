# fly.toml app configuration file generated for openchesslab on 2026-09-25T11:10:11+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openchesslab'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  PHX_SERVER = 'true'
  PHX_HOST = 'openchesslab.fly.dev'
  DNS_CLUSTER_QUERY = 'openchesslab.internal'
  POSITION_STORE_OWNER = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
